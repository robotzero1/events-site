; The public website's own PHP: a pool of its own, as a user of its own, so that it cannot read the API's
; settings or write anything but its own `var/`. Installed by hand as /etc/php/8.4/fpm/pool.d/events-site.conf.

[events-site]
user = events-site
group = events-site

listen = /run/php/events-site.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s

; It reads its own code and keeps its cache, log and secret in its own var/.
php_admin_value[open_basedir] = /var/www/events-site:/tmp
; A poster of up to 6 MB in a request of 8, as the API's server takes (public/.user.ini says the same).
php_admin_value[upload_max_filesize] = 6M
php_admin_value[post_max_size] = 8M
php_admin_flag[expose_php] = off
