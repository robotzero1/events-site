# The public website at the root of events.firemouth.net, beside the API and the admin panel. Included in the
# server block of /etc/nginx/sites-available/events in place of the API's own `location /`, and installed by hand
# from this repository: changing it here changes nothing on the server until it is copied there.
#
# The API keeps /api/ (a plain prefix, so that the regex location of the programme upload still applies to its
# own address), /storage/ (its photos) and /up; the admin panel keeps /admin/ by its own snippet. Everything else
# is the website's: its pages, /assets/, /sitemap.xml and /robots.txt, all answered by its one PHP file.

location /api/ {
    try_files $uri /index.php?$query_string;
}

location = /up {
    try_files $uri /index.php?$query_string;
}

location /storage/ {
    try_files $uri =404;
}

location / {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/events-site/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/events-site/public;
    fastcgi_pass unix:/run/php/events-site.sock;
    fastcgi_read_timeout 60s;
}
